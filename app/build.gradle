plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.b0reddev.glass'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.b0reddev.glass'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// No dependencies on purpose: framework Views only, nothing to load at startup but our own classes.
